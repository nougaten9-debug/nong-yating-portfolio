server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/nong-yating-portfolio;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml
        application/xml
        text/xml
        text/plain;

    location = /favicon.ico {
        return 302 /favicon.svg;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|mp3|ogg|wav)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
